<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Velox Admin | Full Logistics Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { font-family: 'Inter', sans-serif; }
        :root { --primary: #D40000; --primary-dark: #B00000; --secondary: #FFCC00; }
        body { background: #f4f6fa; }
        .sidebar-link.active { background: rgba(212,0,0,0.08); color: var(--primary); border-left: 3px solid var(--primary); }
        .sidebar-link:hover { background: rgba(0,0,0,0.04); }
        .toast-message { position: fixed; bottom: 24px; right: 24px; z-index: 9999; background: #1f2937; color: white; padding: 12px 24px; border-radius: 40px; font-weight: 500; font-size: 0.875rem; backdrop-filter: blur(8px); background: rgba(0,0,0,0.85); transition: 0.2s; z-index: 10000; }
        .status-badge { font-size: 0.7rem; font-weight: 600; padding: 4px 12px; border-radius: 9999px; display: inline-block; }
        .modal-backdrop { background: rgba(0,0,0,0.5); backdrop-filter: blur(3px); }
        select.status-select { font-size: 0.7rem; padding: 2px 6px; border-radius: 12px; border: 1px solid #ccc; background: white; }
    </style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="fixed inset-0 bg-[#0A0A1A] z-50 flex items-center justify-center">
    <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full mx-4">
        <div class="text-center mb-6">
            <div class="text-3xl font-black text-[#D40000]">Velox<span class="text-[#FFCC00] bg-gray-900 px-2 rounded">Admin</span></div>
            <p class="text-gray-500 text-sm mt-2">Full location & timeline control</p>
        </div>
        <form id="loginForm">
            <div class="mb-4"><label class="block text-gray-700 text-sm font-bold mb-2">Username</label><input type="text" id="adminUser" class="w-full border border-gray-300 rounded-lg px-4 py-2.5" placeholder="admin" value="admin"></div>
            <div class="mb-6"><label class="block text-gray-700 text-sm font-bold mb-2">Password</label><input type="password" id="adminPass" class="w-full border border-gray-300 rounded-lg px-4 py-2.5" placeholder="••••••" value="admin123"></div>
            <button type="submit" class="w-full bg-[#D40000] hover:bg-[#B00000] text-white font-bold py-2.5 rounded-lg transition"><i class="fas fa-lock mr-2"></i> Login</button>
        </form>
        <p class="text-xs text-center text-gray-400 mt-6">demo: admin / admin123</p>
    </div>
</div>

<!-- MAIN DASHBOARD -->
<div id="dashboardApp" class="hidden min-h-screen flex">
    <aside class="w-72 bg-white shadow-xl border-r border-gray-100 flex-shrink-0 hidden md:block overflow-y-auto" style="height:100vh;">
        <div class="p-5 border-b"><div class="text-2xl font-black text-[#D40000]">Velox<span class="text-[#FFCC00] bg-gray-900 px-1 rounded">Admin</span></div><p class="text-xs text-gray-400">Real‑time tracking</p></div>
        <nav class="py-4">
            <a href="#" data-nav="dashboard" class="sidebar-link flex items-center gap-3 px-6 py-3 text-gray-700 font-medium"><i class="fas fa-tachometer-alt w-5"></i> Dashboard</a>
            <a href="#" data-nav="shipments" class="sidebar-link flex items-center gap-3 px-6 py-3 text-gray-700"><i class="fas fa-box w-5"></i> Shipments & Location</a>
            <a href="#" data-nav="customs" class="sidebar-link flex items-center gap-3 px-6 py-3 text-gray-700"><i class="fas fa-file-contract w-5"></i> Customs Hold</a>
            <a href="#" data-nav="claims" class="sidebar-link flex items-center gap-3 px-6 py-3 text-gray-700"><i class="fas fa-file-invoice-dollar w-5"></i> Claims</a>
            <a href="#" data-nav="complaints" class="sidebar-link flex items-center gap-3 px-6 py-3 text-gray-700"><i class="fas fa-comment-dots w-5"></i> Complaints</a>
            <a href="#" data-nav="reports" class="sidebar-link flex items-center gap-3 px-6 py-3 text-gray-700"><i class="fas fa-chart-line w-5"></i> Reports</a>
        </nav>
        <div class="absolute bottom-6 left-0 right-0 px-5"><button id="logoutBtn" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 py-2 rounded-lg"><i class="fas fa-sign-out-alt mr-2"></i> Logout</button></div>
    </aside>

    <main class="flex-1 overflow-x-auto">
        <div class="bg-white shadow-sm sticky top-0 z-10 px-6 py-4 border-b flex justify-between items-center">
            <h2 id="pageTitle" class="text-xl font-bold text-gray-800"><i class="fas fa-map-marker-alt text-red-500 mr-2"></i>Package Location Manager</h2>
            <div><span class="text-sm text-gray-500"><i class="fas fa-user-shield text-red-500 mr-1"></i> Super Admin</span></div>
        </div>
        <div id="dynamicPanel" class="p-6"></div>
    </main>
</div>

<!-- MODAL -->
<div id="globalModal" class="fixed inset-0 z-50 hidden items-center justify-center">
    <div class="absolute inset-0 bg-black/50 modal-backdrop" id="modalOverlay"></div>
    <div class="relative bg-white rounded-2xl shadow-2xl max-w-2xl w-full mx-4 max-h-[90vh] overflow-y-auto">
        <div class="flex justify-between items-center border-b px-6 py-4 sticky top-0 bg-white"><h3 id="modalTitle" class="text-xl font-bold">Modal</h3><button id="closeModalBtn" class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button></div>
        <div id="modalBody" class="px-6 py-5"></div>
        <div id="modalFooter" class="border-t px-6 py-4 flex justify-end gap-3 bg-gray-50"></div>
    </div>
</div>

<script>
    // ========== DATA MODELS ==========
    let shipments = [
        { id: 1, trackingNumber: "VX123456", customer: "John Smith", 
          fromCountry: "United Kingdom", fromCity: "London", 
          toCountry: "United States", toCity: "New York", 
          weight: "5.5", service: "Express", status: "in_transit", customsHold: false, holdReason: "",
          locationHistory: [
              { country: "United Kingdom", city: "London", timestamp: "2025-02-10 08:30", event: "Shipment created" },
              { country: "United Kingdom", city: "Heathrow Airport", timestamp: "2025-02-12 14:20", event: "In transit" }
          ] },
        { id: 2, trackingNumber: "VX789012", customer: "Sarah Johnson", 
          fromCountry: "United States", fromCity: "San Francisco",
          toCountry: "United Kingdom", toCity: "London",
          weight: "12.0", service: "Priority", status: "delivered", customsHold: false, holdReason: "",
          locationHistory: [
              { country: "United States", city: "San Francisco", timestamp: "2025-02-01 09:00", event: "Shipment created" },
              { country: "United States", city: "New York JFK", timestamp: "2025-02-03 22:15", event: "In transit" },
              { country: "United Kingdom", city: "London Heathrow", timestamp: "2025-02-05 11:30", event: "Delivered" }
          ] },
        { id: 3, trackingNumber: "VX345678", customer: "Marcus Rivera", 
          fromCountry: "Germany", fromCity: "Frankfurt",
          toCountry: "Brazil", toCity: "Sao Paulo",
          weight: "45.0", service: "Freight", status: "customs_hold", customsHold: true, holdReason: "Missing commercial invoice",
          locationHistory: [
              { country: "Germany", city: "Frankfurt", timestamp: "2025-02-14 10:00", event: "Shipment created" },
              { country: "Brazil", city: "GRU Airport - Customs", timestamp: "2025-02-15 09:20", event: "Customs hold" }
          ] },
        { id: 4, trackingNumber: "VX901234", customer: "Emma Chen", 
          fromCountry: "China", fromCity: "Shanghai",
          toCountry: "Canada", toCity: "Toronto",
          weight: "2.2", service: "Express", status: "pending", customsHold: false, holdReason: "",
          locationHistory: [
              { country: "China", city: "Shanghai Hub", timestamp: "2025-02-16 13:45", event: "Booking confirmed" }
          ] }
    ];
    let claims = [
        { id: 1, trackingNumber: "VX789012", customer: "Sarah Johnson", description: "Damaged", amount: 250, status: "pending", date: "2025-02-06" },
        { id: 2, trackingNumber: "VX123456", customer: "John Smith", description: "Lost", amount: 120, status: "approved", date: "2025-02-11" }
    ];
    let complaints = [
        { id: 1, trackingNumber: "VX789012", customer: "Sarah Johnson", issue: "Delay & rude driver", status: "open", date: "2025-02-07" },
        { id: 2, trackingNumber: "VX345678", customer: "Marcus Rivera", issue: "Customs no update", status: "resolved", date: "2025-02-15" }
    ];
    let auditLogs = [{ timestamp: new Date().toLocaleString(), action: "System ready" }];

    // Persistence helpers
    function persistData() {
        localStorage.setItem('velox_shipments', JSON.stringify(shipments));
        localStorage.setItem('velox_claims', JSON.stringify(claims));
        localStorage.setItem('velox_complaints', JSON.stringify(complaints));
        localStorage.setItem('velox_audit', JSON.stringify(auditLogs));
    }
    function loadData() {
        try {
            if(localStorage.getItem('velox_shipments')) shipments = JSON.parse(localStorage.getItem('velox_shipments'));
            if(localStorage.getItem('velox_claims')) claims = JSON.parse(localStorage.getItem('velox_claims'));
            if(localStorage.getItem('velox_complaints')) complaints = JSON.parse(localStorage.getItem('velox_complaints'));
            if(localStorage.getItem('velox_audit')) auditLogs = JSON.parse(localStorage.getItem('velox_audit'));
        } catch(e) {}
    }
    function addLog(action) { auditLogs.unshift({ timestamp: new Date().toLocaleString(), action }); if(auditLogs.length>100) auditLogs.pop(); persistData(); }
    function showToast(msg, type="info") { const t=document.createElement('div'); t.className='toast-message'; t.innerHTML=`<i class="fas ${type==='success'?'fa-check-circle':type==='danger'?'fa-exclamation-triangle':'fa-info-circle'} mr-2"></i>${msg}`; document.body.appendChild(t); setTimeout(()=>{ t.style.opacity='0'; setTimeout(()=>t.remove(),300); },2800); }

    // Modal functions
    function openModal(title, bodyHtml, confirmText="Confirm", cancelText="Cancel", onConfirm=null) {
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalBody').innerHTML = bodyHtml;
        const footer = document.getElementById('modalFooter');
        footer.innerHTML = `<button id="modalCancelBtn" class="px-4 py-2 border rounded-lg text-gray-700 hover:bg-gray-100">${cancelText}</button><button id="modalConfirmBtn" class="px-4 py-2 bg-[#D40000] text-white rounded-lg hover:bg-[#B00000]">${confirmText}</button>`;
        const modal = document.getElementById('globalModal');
        modal.classList.remove('hidden'); modal.style.display='flex';
        const cancelBtn = document.getElementById('modalCancelBtn');
        const confirmBtn = document.getElementById('modalConfirmBtn');
        const closeBtn = document.getElementById('closeModalBtn');
        const overlay = document.getElementById('modalOverlay');
        const newCancel = cancelBtn.cloneNode(true);
        const newConfirm = confirmBtn.cloneNode(true);
        cancelBtn.parentNode.replaceChild(newCancel, cancelBtn);
        confirmBtn.parentNode.replaceChild(newConfirm, confirmBtn);
        newCancel.onclick = closeModal;
        newConfirm.onclick = () => { if(onConfirm) onConfirm(); closeModal(); };
        closeBtn.onclick = closeModal;
        overlay.onclick = closeModal;
    }
    function closeModal() { const modal=document.getElementById('globalModal'); modal.classList.add('hidden'); modal.style.display='none'; }

    function getCurrentLocation(ship) {
        if(!ship.locationHistory || ship.locationHistory.length===0) return { country: "Unknown", city: "Unknown", timestamp: "N/A", event: "" };
        const last = ship.locationHistory[ship.locationHistory.length-1];
        return { country: last.country, city: last.city, timestamp: last.timestamp, event: last.event };
    }

    // Helper to update status and log timeline
    function updateShipmentStatus(ship, newStatus, reasonForCustoms = "") {
        const oldStatus = ship.status;
        if (oldStatus === newStatus) return;
        ship.status = newStatus;
        // Handle customs hold flag
        if (newStatus === "customs_hold") {
            ship.customsHold = true;
            if (reasonForCustoms) ship.holdReason = reasonForCustoms;
            else if (!ship.holdReason) ship.holdReason = "Customs inspection required";
            ship.locationHistory.push({
                country: "Customs",
                city: "Border Control",
                timestamp: new Date().toLocaleString(),
                event: `Status changed to customs hold: ${ship.holdReason}`
            });
        } else {
            if (oldStatus === "customs_hold") {
                ship.customsHold = false;
                ship.holdReason = "";
                ship.locationHistory.push({
                    country: "Released",
                    city: "Customs",
                    timestamp: new Date().toLocaleString(),
                    event: "Released from customs hold"
                });
            }
            ship.locationHistory.push({
                country: getCurrentLocation(ship).country || "System",
                city: getCurrentLocation(ship).city || "Update",
                timestamp: new Date().toLocaleString(),
                event: `Status changed from ${oldStatus} to ${newStatus}`
            });
        }
        addLog(`Shipment ${ship.trackingNumber} status updated to ${newStatus}`);
        persistData();
    }

    // ========== DASHBOARD ==========
    function renderDashboard() {
        const total = shipments.length;
        const customHold = shipments.filter(s=>s.customsHold).length;
        const pendingClaims = claims.filter(c=>c.status==='pending').length;
        const openComplaints = complaints.filter(c=>c.status==='open').length;
        const panel = document.getElementById('dynamicPanel');
        panel.innerHTML = `
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                <div class="bg-white rounded-2xl p-5 shadow-sm border"><div class="flex justify-between"><div><p class="text-gray-500 text-sm">Total Shipments</p><p class="text-3xl font-bold">${total}</p></div><div class="w-10 h-10 bg-red-100 rounded-full flex text-red-600 items-center justify-center"><i class="fas fa-box"></i></div></div></div>
                <div class="bg-white rounded-2xl p-5 shadow-sm border"><div class="flex justify-between"><div><p class="text-gray-500 text-sm">Customs Hold</p><p class="text-3xl font-bold">${customHold}</p></div><div class="w-10 h-10 bg-yellow-100 rounded-full flex text-yellow-700 items-center justify-center"><i class="fas fa-file-contract"></i></div></div></div>
                <div class="bg-white rounded-2xl p-5 shadow-sm border"><div class="flex justify-between"><div><p class="text-gray-500 text-sm">Pending Claims</p><p class="text-3xl font-bold">${pendingClaims}</p></div><div class="w-10 h-10 bg-blue-100 rounded-full flex text-blue-600 items-center justify-center"><i class="fas fa-dollar-sign"></i></div></div></div>
                <div class="bg-white rounded-2xl p-5 shadow-sm border"><div class="flex justify-between"><div><p class="text-gray-500 text-sm">Open Complaints</p><p class="text-3xl font-bold">${openComplaints}</p></div><div class="w-10 h-10 bg-purple-100 rounded-full flex text-purple-600 items-center justify-center"><i class="fas fa-comment"></i></div></div></div>
            </div>
            <div class="grid lg:grid-cols-2 gap-6">
                <div class="bg-white rounded-2xl p-5 border"><h3 class="font-bold mb-3">Shipment Status</h3><canvas id="statusChart" height="200"></canvas></div>
                <div class="bg-white rounded-2xl p-5 border"><h3 class="font-bold mb-3">Recent Activity</h3><div class="space-y-2 max-h-64 overflow-auto">${auditLogs.slice(0,8).map(l=>`<div class="text-xs border-b pb-1"><span class="text-gray-400">${l.timestamp}</span> - ${l.action}</div>`).join('')}</div><button id="clearAuditBtn" class="mt-3 text-xs text-red-500">Clear logs</button></div>
            </div>
            <div class="mt-8 bg-white rounded-2xl p-5 border"><h3 class="font-bold">Customs Alerts</h3>${shipments.filter(s=>s.customsHold).map(s=>`<div class="border-l-4 border-yellow-400 bg-yellow-50 p-3 my-2"><strong>${s.trackingNumber}</strong> - ${s.holdReason} <button class="releaseCustomsBtn ml-4 text-red-600" data-id="${s.id}">Release</button></div>`).join('')||'<p>None</p>'}</div>
        `;
        const statusCounts = { pending:0, in_transit:0, customs_hold:0, out_for_delivery:0, delivered:0 };
        shipments.forEach(s=>{ statusCounts[s.status] = (statusCounts[s.status]||0)+1; });
        const ctx = document.getElementById('statusChart')?.getContext('2d');
        if(ctx) new Chart(ctx, { type:'doughnut', data:{ labels:Object.keys(statusCounts), datasets:[{ data:Object.values(statusCounts), backgroundColor:['#D40000','#FFCC00','#f97316','#3b82f6','#10b981'] }] } });
        document.querySelectorAll('.releaseCustomsBtn').forEach(btn=>{ btn.addEventListener('click',()=>{ const id=parseInt(btn.dataset.id); const ship=shipments.find(s=>s.id===id); if(ship){ updateShipmentStatus(ship, "in_transit"); renderDashboard(); showToast("Released from customs"); } }); });
        document.getElementById('clearAuditBtn')?.addEventListener('click',()=>{ auditLogs=[]; addLog("Logs cleared"); renderDashboard(); });
    }

    // ========== SHIPMENTS WITH FULL CONTROLS ==========
    function renderShipments() {
        let rows = shipments.map(s => {
            const curr = getCurrentLocation(s);
            return `<tr class="border-b hover:bg-gray-50">
                <td class="px-4 py-2 font-mono">${s.trackingNumber}</td>
                <td class="px-4 py-2">${s.customer}</td>
                <td class="px-4 py-2">${s.fromCity}, ${s.fromCountry} → ${s.toCity}, ${s.toCountry}</td>
                <td class="px-4 py-2">
                    <select class="status-select border rounded px-2 py-1 text-sm" data-id="${s.id}">
                        <option value="pending" ${s.status==='pending' ? 'selected' : ''}>Pending</option>
                        <option value="in_transit" ${s.status==='in_transit' ? 'selected' : ''}>In Transit</option>
                        <option value="customs_hold" ${s.status==='customs_hold' ? 'selected' : ''}>Customs Hold</option>
                        <option value="out_for_delivery" ${s.status==='out_for_delivery' ? 'selected' : ''}>Out for Delivery</option>
                        <option value="delivered" ${s.status==='delivered' ? 'selected' : ''}>Delivered</option>
                    </select>
                </td>
                <td class="px-4 py-2 text-sm"><strong>${curr.country}, ${curr.city}</strong><br><span class="text-xs text-gray-400">${curr.timestamp}</span></td>
                <td class="px-4 py-2">
                    <button class="updateLocationBtn bg-indigo-600 text-white px-3 py-1 rounded text-xs" data-id="${s.id}"><i class="fas fa-map-marker-alt"></i> Location</button>
                    <button class="viewHistoryBtn bg-gray-600 text-white px-3 py-1 rounded text-xs ml-1" data-id="${s.id}"><i class="fas fa-history"></i> History</button>
                    <button class="editShipBtn bg-blue-500 text-white px-3 py-1 rounded text-xs ml-1" data-id="${s.id}"><i class="fas fa-edit"></i> Edit</button>
                    <button class="customsToggleBtn bg-yellow-500 text-white px-3 py-1 rounded text-xs ml-1" data-id="${s.id}"><i class="fas ${s.customsHold ? 'fa-check-circle' : 'fa-stop-circle'}"></i> Customs</button>
                </td>
             </tr>`;
        }).join('');
        const panel = document.getElementById('dynamicPanel');
        panel.innerHTML = `
            <div class="bg-white rounded-2xl shadow-sm border overflow-hidden">
                <div class="px-6 py-4 border-b flex justify-between flex-wrap gap-2"><h2 class="font-bold text-xl"><i class="fas fa-location-dot text-red-500"></i> Live Package Tracking</h2><div><button id="addShipBtn" class="bg-[#D40000] text-white px-4 py-2 rounded-lg text-sm"><i class="fas fa-plus"></i> New Shipment</button></div></div>
                <div class="overflow-x-auto"><table class="min-w-full"><thead class="bg-gray-50"><tr><th class="px-4 py-3 text-left">Tracking</th><th>Customer</th><th>Route</th><th>Status</th><th>Current Location</th><th>Actions</th></tr></thead><tbody>${rows}</tbody></table></div>
            </div>
            <div class="mt-6 bg-white rounded-2xl p-5 border"><h3 class="font-bold"><i class="fas fa-calendar-plus"></i> Quick Timeline Event</h3><div class="flex flex-wrap gap-3 mt-2"><input id="trackEventNum" placeholder="Tracking Number" class="border p-2 rounded flex-1"><input id="eventDesc" placeholder="Event description" class="border p-2 rounded flex-1"><input id="eventLoc" placeholder="Location" class="border p-2 rounded flex-1"><button id="addQuickEventBtn" class="bg-gray-800 text-white px-4 rounded">Add Event</button></div></div>
        `;
        // Status change via dropdown
        document.querySelectorAll('.status-select').forEach(sel => {
            sel.addEventListener('change', (e) => {
                const id = parseInt(sel.dataset.id);
                const ship = shipments.find(s => s.id === id);
                if (ship) {
                    let newStatus = sel.value;
                    if (newStatus === 'customs_hold') {
                        let reason = prompt("Enter customs hold reason:", ship.holdReason || "Documentation required");
                        if (reason === null) { sel.value = ship.status; return; }
                        updateShipmentStatus(ship, newStatus, reason);
                    } else {
                        updateShipmentStatus(ship, newStatus);
                    }
                    renderShipments(); // refresh to show new status and dropdown
                    showToast(`Status changed to ${newStatus.replace('_',' ')}`, "success");
                }
            });
        });
        // Event delegation for buttons
        const panelDiv = document.getElementById('dynamicPanel');
        panelDiv.addEventListener('click', (e) => {
            const updateBtn = e.target.closest('.updateLocationBtn');
            const historyBtn = e.target.closest('.viewHistoryBtn');
            const editBtn = e.target.closest('.editShipBtn');
            const customsBtn = e.target.closest('.customsToggleBtn');
            if (updateBtn) {
                const id = parseInt(updateBtn.dataset.id);
                const ship = shipments.find(s => s.id === id);
                if (!ship) return;
                const now = new Date();
                const defaultDateTime = now.toISOString().slice(0,16);
                openModal(`📍 Update Location for ${ship.trackingNumber}`, `
                    <div class="space-y-3">
                        <div><label class="font-bold">Country *</label><input id="locCountry" class="w-full border p-2 rounded" placeholder="e.g. United States"></div>
                        <div><label class="font-bold">City *</label><input id="locCity" class="w-full border p-2 rounded" placeholder="e.g. Chicago, IL"></div>
                        <div><label class="font-bold">Event / Milestone (optional)</label><input id="locEvent" class="w-full border p-2 rounded" placeholder="e.g. Arrived at sort facility"></div>
                        <div><label class="font-bold">Date & Time</label><input type="datetime-local" id="locTimestamp" class="w-full border p-2 rounded" value="${defaultDateTime}"></div>
                        <div class="text-sm text-gray-500">This will add a new location entry to the package timeline.</div>
                    </div>
                `, "Add Location Update", "Cancel", () => {
                    const newCountry = document.getElementById('locCountry').value.trim();
                    const newCity = document.getElementById('locCity').value.trim();
                    if (!newCountry || !newCity) { showToast("Country and City are required", "danger"); return; }
                    const eventText = document.getElementById('locEvent').value.trim() || "Location updated";
                    let timestampRaw = document.getElementById('locTimestamp').value;
                    let displayTimestamp = timestampRaw ? timestampRaw.replace('T', ' ') : new Date().toLocaleString();
                    ship.locationHistory.push({ country: newCountry, city: newCity, timestamp: displayTimestamp, event: eventText });
                    addLog(`Location added for ${ship.trackingNumber}: ${newCountry}, ${newCity}`);
                    persistData();
                    renderShipments();
                    showToast(`✓ Location added for ${ship.trackingNumber}`, "success");
                });
            }
            if (historyBtn) {
                const id = parseInt(historyBtn.dataset.id);
                const ship = shipments.find(s => s.id === id);
                if (!ship) return;
                const historyHtml = ship.locationHistory.map(h => `<div class="border-b pb-2 mb-2"><div class="text-xs text-gray-500">${h.timestamp}</div><div class="font-semibold">📍 ${h.country}, ${h.city}</div><div class="text-sm text-gray-600">${h.event}</div></div>`).join('');
                openModal(`📜 Location History - ${ship.trackingNumber}`, `<div class="max-h-96 overflow-auto">${historyHtml || '<p>No history</p>'}</div>`, "Close", "Close", () => {});
            }
            if (editBtn) {
                const id = parseInt(editBtn.dataset.id);
                const ship = shipments.find(s => s.id === id);
                openModal("✏️ Edit Shipment Details", `
                    <div class="grid grid-cols-2 gap-3">
                        <div><label>Tracking</label><input id="editTrack" value="${ship.trackingNumber}" class="w-full border p-2"></div>
                        <div><label>Customer</label><input id="editCust" value="${ship.customer}" class="w-full border p-2"></div>
                        <div><label>Origin Country</label><input id="editFromCountry" value="${ship.fromCountry}" class="w-full border p-2"></div>
                        <div><label>Origin City</label><input id="editFromCity" value="${ship.fromCity}" class="w-full border p-2"></div>
                        <div><label>Dest Country</label><input id="editToCountry" value="${ship.toCountry}" class="w-full border p-2"></div>
                        <div><label>Dest City</label><input id="editToCity" value="${ship.toCity}" class="w-full border p-2"></div>
                        <div><label>Weight (kg)</label><input id="editWeight" value="${ship.weight}" class="w-full border p-2"></div>
                        <div><label>Service</label><select id="editService" class="w-full border p-2"><option ${ship.service==='Express'?'selected':''}>Express</option><option ${ship.service==='Priority'?'selected':''}>Priority</option><option ${ship.service==='Freight'?'selected':''}>Freight</option></select></div>
                        ${ship.customsHold ? `<div><label>Customs Hold Reason</label><textarea id="editHoldReason" class="w-full border p-2">${ship.holdReason}</textarea></div>` : ''}
                    </div>
                `, "Save Changes", "Cancel", () => {
                    ship.trackingNumber = document.getElementById('editTrack').value;
                    ship.customer = document.getElementById('editCust').value;
                    ship.fromCountry = document.getElementById('editFromCountry').value;
                    ship.fromCity = document.getElementById('editFromCity').value;
                    ship.toCountry = document.getElementById('editToCountry').value;
                    ship.toCity = document.getElementById('editToCity').value;
                    ship.weight = document.getElementById('editWeight').value;
                    ship.service = document.getElementById('editService').value;
                    if (ship.customsHold && document.getElementById('editHoldReason')) {
                        ship.holdReason = document.getElementById('editHoldReason').value;
                    }
                    persistData();
                    renderShipments();
                    showToast("Shipment updated", "success");
                    addLog(`Edited shipment ${ship.trackingNumber}`);
                });
            }
            if (customsBtn) {
                const id = parseInt(customsBtn.dataset.id);
                const ship = shipments.find(s => s.id === id);
                if (!ship) return;
                if (ship.customsHold) {
                    // Release from customs
                    updateShipmentStatus(ship, "in_transit");
                    showToast(`Released ${ship.trackingNumber} from customs`, "success");
                } else {
                    // Place on hold
                    let reason = prompt("Enter customs hold reason:", "Missing documentation");
                    if (reason !== null) {
                        updateShipmentStatus(ship, "customs_hold", reason);
                        showToast(`Customs hold applied for ${ship.trackingNumber}`, "warning");
                    }
                }
                renderShipments();
            }
        });
        // Add new shipment button
        document.getElementById('addShipBtn')?.addEventListener('click', () => {
            openModal("Create New Shipment", `
                <div class="grid grid-cols-2 gap-3">
                    <div><label>Tracking #</label><input id="newTrack" class="w-full border p-2"></div>
                    <div><label>Customer</label><input id="newCust" class="w-full border p-2"></div>
                    <div><label>Origin Country</label><input id="newFromCountry" class="w-full border p-2"></div>
                    <div><label>Origin City</label><input id="newFromCity" class="w-full border p-2"></div>
                    <div><label>Dest Country</label><input id="newToCountry" class="w-full border p-2"></div>
                    <div><label>Dest City</label><input id="newToCity" class="w-full border p-2"></div>
                    <div><label>Weight (kg)</label><input id="newWeight" class="w-full border p-2"></div>
                    <div><label>Service</label><select id="newService"><option>Express</option><option>Priority</option><option>Freight</option></select></div>
                    <div class="col-span-2"><label>Initial Location (Country)</label><input id="initCountry" class="w-full border p-2"></div>
                    <div class="col-span-2"><label>Initial Location (City)</label><input id="initCity" class="w-full border p-2"></div>
                </div>
            `, "Create", "Cancel", () => {
                const newId = shipments.length+1;
                const newShip = {
                    id: newId,
                    trackingNumber: document.getElementById('newTrack').value,
                    customer: document.getElementById('newCust').value,
                    fromCountry: document.getElementById('newFromCountry').value,
                    fromCity: document.getElementById('newFromCity').value,
                    toCountry: document.getElementById('newToCountry').value,
                    toCity: document.getElementById('newToCity').value,
                    weight: document.getElementById('newWeight').value,
                    service: document.getElementById('newService').value,
                    status: "pending",
                    customsHold: false,
                    holdReason: "",
                    locationHistory: []
                };
                const initCountry = document.getElementById('initCountry').value.trim();
                const initCity = document.getElementById('initCity').value.trim();
                if(initCountry && initCity) {
                    newShip.locationHistory.push({ country: initCountry, city: initCity, timestamp: new Date().toLocaleString(), event: "Shipment created" });
                } else {
                    newShip.locationHistory.push({ country: "Origin", city: "Unknown", timestamp: new Date().toLocaleString(), event: "Registered" });
                }
                shipments.push(newShip);
                persistData();
                addLog(`Added shipment ${newShip.trackingNumber}`);
                renderShipments();
                showToast("Shipment created", "success");
            });
        });
        // Quick timeline event adder
        document.getElementById('addQuickEventBtn')?.addEventListener('click', () => {
            const tn = document.getElementById('trackEventNum').value.trim();
            const eventDesc = document.getElementById('eventDesc').value.trim();
            const loc = document.getElementById('eventLoc').value.trim();
            const ship = shipments.find(s => s.trackingNumber === tn);
            if (!ship) { showToast("Tracking number not found", "danger"); return; }
            if (!eventDesc) { showToast("Event description required", "danger"); return; }
            const now = new Date().toLocaleString();
            ship.locationHistory.push({
                country: loc || getCurrentLocation(ship).country,
                city: loc || getCurrentLocation(ship).city,
                timestamp: now,
                event: eventDesc
            });
            persistData();
            addLog(`Timeline event added for ${tn}: ${eventDesc}`);
            renderShipments();
            showToast(`Event added for ${tn}`, "success");
            document.getElementById('trackEventNum').value = '';
            document.getElementById('eventDesc').value = '';
            document.getElementById('eventLoc').value = '';
        });
    }

    // ========== CUSTOMS HOLD (dedicated page) ==========
    function renderCustomsHold() {
        const holdItems = shipments.filter(s=>s.customsHold);
        const panel = document.getElementById('dynamicPanel');
        panel.innerHTML = `<div class="bg-white rounded-2xl p-6 border"><h2 class="text-xl font-bold mb-4">Customs Hold Management</h2>${holdItems.map(s=>`<div class="border p-3 mb-2 bg-yellow-50"><strong>${s.trackingNumber}</strong> - ${s.customer}<br>Reason: ${s.holdReason}<br><button class="releaseBtn bg-green-600 text-white px-3 py-1 rounded mt-2" data-id="${s.id}">Release Shipment</button> <button class="updateReasonBtn bg-blue-600 text-white px-3 py-1 rounded mt-2 ml-2" data-id="${s.id}">Update Reason</button></div>`).join('')||'<p>No shipments on customs hold</p>'}</div>`;
        document.querySelectorAll('.releaseBtn').forEach(btn=>{ btn.addEventListener('click',()=>{ const id=parseInt(btn.dataset.id); const ship=shipments.find(s=>s.id===id); if(ship){ updateShipmentStatus(ship, "in_transit"); renderCustomsHold(); showToast("Released"); } }); });
        document.querySelectorAll('.updateReasonBtn').forEach(btn=>{ btn.addEventListener('click',()=>{ const id=parseInt(btn.dataset.id); const ship=shipments.find(s=>s.id===id); if(ship){ const newReason = prompt("Enter new hold reason:", ship.holdReason); if(newReason){ ship.holdReason = newReason; persistData(); renderCustomsHold(); showToast("Reason updated"); } } }); });
    }

    // ========== CLAIMS ==========
    function renderClaims() {
        const panel = document.getElementById('dynamicPanel');
        panel.innerHTML = `<div class="bg-white rounded-2xl p-6 border"><h2 class="text-xl font-bold mb-4">Claims Management</h2><table class="min-w-full"><thead class="bg-gray-100"><tr><th>Tracking</th><th>Customer</th><th>Description</th><th>Amount</th><th>Status</th><th>Action</th></tr></thead><tbody>${claims.map(c=>`<tr class="border-b"><td class="p-2">${c.trackingNumber}</td><td>${c.customer}</td><td>${c.description}</td><td>$${c.amount}</td><td>${c.status}</td><td><button class="approveClaim bg-green-600 text-white px-2 py-1 rounded" data-id="${c.id}">Approve</button> <button class="rejectClaim bg-red-600 text-white px-2 py-1 rounded" data-id="${c.id}">Reject</button> <button class="deleteClaim bg-gray-400 text-white px-2 py-1 rounded" data-id="${c.id}">Delete</button></td></tr>`).join('')}</tbody></table><button id="addClaimBtn" class="mt-4 bg-red-600 text-white px-4 py-2 rounded">+ Add Claim</button></div>`;
        document.querySelectorAll('.approveClaim').forEach(btn=>{ btn.addEventListener('click',()=>{ const id=parseInt(btn.dataset.id); const c=claims.find(c=>c.id===id); if(c){ c.status="approved"; persistData(); renderClaims(); showToast("Claim approved"); addLog(`Claim ${id} approved`); } }); });
        document.querySelectorAll('.rejectClaim').forEach(btn=>{ btn.addEventListener('click',()=>{ const id=parseInt(btn.dataset.id); const c=claims.find(c=>c.id===id); if(c){ c.status="rejected"; persistData(); renderClaims(); showToast("Claim rejected"); addLog(`Claim ${id} rejected`); } }); });
        document.querySelectorAll('.deleteClaim').forEach(btn=>{ btn.addEventListener('click',()=>{ const id=parseInt(btn.dataset.id); claims = claims.filter(c=>c.id!==id); persistData(); renderClaims(); showToast("Claim deleted"); }); });
        document.getElementById('addClaimBtn')?.addEventListener('click',()=>{ openModal("New Claim","<div><label>Tracking</label><input id='track'><label>Customer</label><input id='cust'><label>Description</label><textarea id='desc'></textarea><label>Amount ($)</label><input id='amount' type='number'></div>","Add","Cancel",()=>{ claims.push({ id:claims.length+1, trackingNumber:document.getElementById('track').value, customer:document.getElementById('cust').value, description:document.getElementById('desc').value, amount:parseFloat(document.getElementById('amount').value), status:"pending", date:new Date().toISOString().slice(0,10) }); persistData(); renderClaims(); closeModal(); showToast("Claim added"); addLog("New claim added"); }); });
    }

    // ========== COMPLAINTS ==========
    function renderComplaints() {
        const panel = document.getElementById('dynamicPanel');
        panel.innerHTML = `<div class="bg-white rounded-2xl p-6 border"><h2 class="text-xl font-bold mb-4">Customer Complaints</h2>${complaints.map(c=>`<div class="border p-3 mb-2"><strong>${c.trackingNumber}</strong> - ${c.customer}<br>${c.issue}<br>Status: ${c.status} <button class="resolveComp bg-green-600 text-white px-2 py-1 rounded" data-id="${c.id}">Resolve</button> <button class="deleteComp bg-gray-400 text-white px-2 py-1 rounded ml-1" data-id="${c.id}">Delete</button></div>`).join('')}<button id="addCompBtn" class="mt-4 bg-red-600 text-white px-4 py-2 rounded">+ Add Complaint</button></div>`;
        document.querySelectorAll('.resolveComp').forEach(btn=>{ btn.addEventListener('click',()=>{ const id=parseInt(btn.dataset.id); const c=complaints.find(c=>c.id===id); if(c){ c.status="resolved"; persistData(); renderComplaints(); showToast("Resolved"); addLog(`Complaint ${id} resolved`); } }); });
        document.querySelectorAll('.deleteComp').forEach(btn=>{ btn.addEventListener('click',()=>{ const id=parseInt(btn.dataset.id); complaints = complaints.filter(c=>c.id!==id); persistData(); renderComplaints(); showToast("Deleted"); }); });
        document.getElementById('addCompBtn')?.addEventListener('click',()=>{ openModal("New Complaint","<div><label>Tracking</label><input id='track'><label>Customer</label><input id='cust'><label>Issue</label><textarea id='issue'></textarea></div>","Add","Cancel",()=>{ complaints.push({ id:complaints.length+1, trackingNumber:document.getElementById('track').value, customer:document.getElementById('cust').value, issue:document.getElementById('issue').value, status:"open", date:new Date().toISOString().slice(0,10) }); persistData(); renderComplaints(); closeModal(); showToast("Complaint added"); addLog("New complaint added"); }); });
    }

    // ========== REPORTS ==========
    function renderReports() {
        const totalRevenue = claims.filter(c=>c.status==='approved').reduce((s,c)=>s+c.amount,0);
        const panel = document.getElementById('dynamicPanel');
        panel.innerHTML = `<div class="bg-white rounded-2xl p-6 border"><h2 class="text-xl font-bold">Reports</h2><div class="grid grid-cols-2 gap-4 mt-4"><div class="bg-gray-100 p-4 rounded">Paid Claims: $${totalRevenue}</div><div class="bg-gray-100 p-4 rounded">Active Shipments: ${shipments.filter(s=>s.status!=='delivered').length}</div></div><button id="genReportBtn" class="mt-4 bg-blue-600 text-white px-4 py-2 rounded">Export CSV</button></div>`;
        document.getElementById('genReportBtn')?.addEventListener('click',()=>{ let csv="Tracking,CurrentCountry,CurrentCity,LastUpdate\n"+shipments.map(s=>{const cur=getCurrentLocation(s); return `${s.trackingNumber},${cur.country},${cur.city},${cur.timestamp}`;}).join("\n"); const blob=new Blob([csv],{type:"text/csv"}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download="velox_report.csv"; a.click(); showToast("Report exported"); addLog("Report exported"); });
    }

    // Navigation
    let currentNav = "dashboard";
    function loadNav(nav) {
        currentNav = nav;
        document.querySelectorAll('.sidebar-link').forEach(l=>l.classList.remove('active'));
        document.querySelector(`[data-nav="${nav}"]`)?.classList.add('active');
        const titles={dashboard:"Dashboard",shipments:"Shipments & Location",customs:"Customs Hold",claims:"Claims",complaints:"Complaints",reports:"Reports"};
        document.getElementById('pageTitle').innerHTML = `<i class="fas ${nav==='dashboard'?'fa-chart-line':nav==='shipments'?'fa-map-marker-alt':'fa-cog'} text-red-500 mr-2"></i>${titles[nav]}`;
        if(nav==='dashboard') renderDashboard();
        else if(nav==='shipments') renderShipments();
        else if(nav==='customs') renderCustomsHold();
        else if(nav==='claims') renderClaims();
        else if(nav==='complaints') renderComplaints();
        else if(nav==='reports') renderReports();
    }

    // Login & Init
    document.getElementById('loginForm')?.addEventListener('submit', (e)=>{
        e.preventDefault();
        if(document.getElementById('adminUser').value==='admin' && document.getElementById('adminPass').value==='admin123'){
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('dashboardApp').classList.remove('hidden');
            loadData();
            loadNav('dashboard');
            addLog("Admin login");
        } else alert("Invalid credentials");
    });
    document.getElementById('logoutBtn')?.addEventListener('click',()=>{ addLog("Logout"); document.getElementById('dashboardApp').classList.add('hidden'); document.getElementById('loginScreen').classList.remove('hidden'); });
    document.querySelectorAll('.sidebar-link').forEach(link=>{ link.addEventListener('click',(e)=>{ e.preventDefault(); loadNav(link.dataset.nav); }); });
</script>
</body>
</html>
